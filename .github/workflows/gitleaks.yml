name: gitleaks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  scan:
    uses: RobinCombrink/actions-gitleaks/.github/workflows/gitleaks.yml@9cd6661af6b32359faec39242418cd899247e309 # v1.0.4
